<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guía interactiva de desarrollo web, APIs, seguridad y despliegue.">
    <title>Desarrollo Web Study | Guía de estudio</title>
    <link rel="stylesheet" href="../Redes/css/styles.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a class="logo" href="../">StudyHub <span aria-hidden="true">/</span> Desarrollo web</a>
        <ul class="nav-links">
            <li><button type="button" data-view="temas">📚 Temas</button></li>
            <li><button type="button" data-view="flashcards">🗂️ Flashcards</button></li>
            <li><button type="button" data-view="pruebas">📝 Pruebas</button></li>
            <li><button type="button" data-view="resultados">📊 Resultados</button></li>
        </ul>
    </nav>
    <main id="app-content">
        <section id="temas" class="view-section">
            <h2>Temas de estudio</h2>
            <p>Selecciona un módulo para repasar conceptos de desarrollo web.</p>
            <div id="temas-container" class="grid-container"></div>
        </section>
        <section id="flashcards" class="view-section hidden">
            <h2>Flashcards</h2>
            <p>Repasa los conceptos clave de la guía.</p>
            <div id="flashcard-container"></div>
        </section>
        <section id="pruebas" class="view-section hidden">
            <h2>Prueba de conocimientos</h2>
            <div id="pruebas-container"></div>
        </section>
        <section id="resultados" class="view-section hidden">
            <h2>Análisis de resultados</h2>
            <div id="resultados-container"></div>
        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
