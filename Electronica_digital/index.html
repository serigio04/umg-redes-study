<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Repasa contadores, máquinas de estados, registros y memorias con temas, flashcards y pruebas interactivas.">
    <title>Electrónica Digital | StudyHub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a class="logo subject-home-link" href="../">StudyHub / Electrónica Digital</a>
        <ul class="nav-links">
            <li><button onclick="navigateTo('temas')">📚 Temas</button></li>
            <li><button onclick="navigateTo('flashcards')">🗂️ Flashcards</button></li>
            <li><button onclick="navigateTo('pruebas')">📝 Pruebas</button></li>
            <li><button onclick="navigateTo('resultados')">📊 Resultados</button></li>
        </ul>
    </nav>
    <main id="app-content">
        <section id="temas" class="view-section active">
            <h2>Electrónica Digital</h2>
            <p>Estudia los apuntes y luego refuerza lo aprendido con tarjetas y pruebas.</p>
            <div id="temas-container" class="grid-container"></div>
        </section>
        <section id="flashcards" class="view-section hidden">
            <h2>Flashcards</h2>
            <p>Piensa la respuesta antes de girar cada tarjeta.</p>
            <div id="flashcard-container"></div>
        </section>
        <section id="pruebas" class="view-section hidden">
            <h2>Prueba de conocimientos</h2>
            <div id="pruebas-container"></div>
        </section>
        <section id="resultados" class="view-section hidden">
            <h2>Análisis de resultados</h2>
            <div id="resultados-container"></div>
        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
